[package]
name = "autd3-console"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"
description = "GUI console that launches AUTD3 tools (simulator / TwinCAT setup)"

[[bin]]
name = "autd3-console"
path = "src/main.rs"

[dependencies]
autd3-rs-appliance = { path = "../appliance/lib", features = ["client"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
axoupdater = { version = "0.10.0", default-features = false, features = [
    "blocking",
    "github_releases",
] }
tokio = { version = "1.52.3", default-features = false, features = ["rt"] }

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
