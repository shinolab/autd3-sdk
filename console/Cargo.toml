[package]
name = "autd3-console"
version = "0.13.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"
description = "GUI console that launches AUTD3 tools (simulator / firmware)"
publish = false

[[bin]]
name = "autd3-console"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
