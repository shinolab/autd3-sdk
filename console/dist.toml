[package]
name = "console"
version = "0.11.0"
description = "GUI console that launches AUTD3 tools (simulator / server / firmware)"
repository = "https://github.com/shinolab/autd3-sdk"
license = "MIT"
binaries = ["autd3-console", "autd3-simulator", "autd3-firmware-writer", "autd3-firmware-ota", "autd3-server"]
out-dir = "target/distrib"
build-command = [
    "cargo",
    "run",
    "--quiet",
    "--manifest-path",
    "../xtask/Cargo.toml",
    "--",
    "console",
    "stage",
    "--license",
]
