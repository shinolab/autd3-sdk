name: ci-console

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  console:
    name: console (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          workspaces: |
            console
            xtask
      - name: Format
        if: runner.os == 'Linux'
        run: cargo xtask console format
      - run: cargo xtask console lint
      - run: cargo xtask console test
      - name: Install dist
        if: runner.os == 'Linux'
        run: |
          version=$(grep '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - name: Check dist config
        if: runner.os == 'Linux'
        run: |
          norm() { sed -E 's#(uses: *"?[^"@]+)@[^"[:space:]]*#\1@PIN#' "$1"; }
          norm .github/workflows/console-release.yml > "$RUNNER_TEMP/committed.yml"
          sed -i '/^allow-dirty = /d' dist-workspace.toml
          dist generate
          norm .github/workflows/console-release.yml > "$RUNNER_TEMP/generated.yml"
          git checkout -- .github/workflows/console-release.yml dist-workspace.toml
          diff -u "$RUNNER_TEMP/committed.yml" "$RUNNER_TEMP/generated.yml"
          dist plan
