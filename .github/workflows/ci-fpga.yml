name: ci-fpga

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  VERIBLE_VERSION: v0.0-4080-ga0a8d8eb
  VERIBLE_SHA256: f75daa70f29dbe9624ffee3738408341cfdadbdaf7e5d714a5bcceb9223953e6

jobs:
  fpga:
    name: fpga
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install the pinned Verible release
        run: |
          archive="verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz"
          curl --proto '=https' --tlsv1.2 -LsSf -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/${archive}"
          echo "${VERIBLE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/verible-${VERIBLE_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Verify the committed controller.sv is up to date
        run: cargo xtask fpga gen-controller --check
