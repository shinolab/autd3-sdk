name: ci-semver

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  semver:
    name: semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-semver-checks
      - run: cargo xtask rust semver
