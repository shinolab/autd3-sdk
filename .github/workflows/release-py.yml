name: release-py

on:
  push:
    tags:
      - 'v*'
      - 'py-v*'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-about
      - name: Generate third-party licenses
        run: cargo xtask license generate python

      - name: Build autd3-core
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: '2_28'
          args: --release -m autd3-core/Cargo.toml --find-interpreter -o dist
      - name: Build autd3
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: '2_28'
          args: --release -m autd3/Cargo.toml --find-interpreter -o dist
      - name: Build autd3-pattern
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: '2_28'
          args: --release -m autd3-pattern/Cargo.toml --find-interpreter -o dist
      - name: Build autd3-pattern-holo
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: '2_28'
          args: --release -m autd3-pattern-holo/Cargo.toml --find-interpreter -o dist
      - name: Build autd3-modulation
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: '2_28'
          args: --release -m autd3-modulation/Cargo.toml --find-interpreter -o dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  publish:
    name: release-py
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
