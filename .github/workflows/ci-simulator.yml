name: ci-simulator

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  simulator:
    name: simulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          workspaces: |
            simulator
            xtask
      - name: Format
        if: runner.os == 'Linux'
        run: cargo xtask simulator format
      - run: cargo xtask simulator lint
      - run: cargo xtask simulator test
      - run: cargo xtask simulator build --debug
