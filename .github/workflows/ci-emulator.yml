name: ci-emulator

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: emulator (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          workspaces: |
            extras/autd3-rs-emulator
            xtask
      - name: Format
        run: cargo xtask emulator format
      - run: cargo xtask emulator lint
      - name: Lint (gpu feature; compile+clippy check, no GPU adapter in CI)
        run: cargo xtask emulator lint --gpu
      - run: cargo xtask emulator test
