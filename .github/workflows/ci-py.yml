name: ci-py

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  py:
    name: py (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          workspaces: |
            bindings/python
            xtask
      - uses: astral-sh/setup-uv@v7.6.0
      - name: Format
        if: runner.os == 'Linux'
        run: cargo xtask py format
      - run: cargo xtask py lint
      - run: cargo xtask py test

  py-free-threaded:
    name: py (ubuntu-latest, 3.15t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          workspaces: |
            bindings/python
            xtask
      - uses: astral-sh/setup-uv@v7.6.0
      - run: cargo xtask py test --python 3.15t
