name: ci-cpu

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  cpu:
    name: cpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          components: llvm-tools
      - name: Install the bare-metal Rust target
        run: rustup target add armv7r-none-eabi
      - run: cargo xtask cpu format
      - run: cargo xtask cpu lint
      - run: cargo xtask cpu lint --loom
      - run: cargo xtask cpu test
      - run: cargo xtask cpu test --loom
      - run: cargo xtask cpu build
      - name: Verify the committed fpga_params.rs is up to date
        run: git diff --exit-code firmware/cpu/fw/src/fpga_params.rs firmware/cpu/wire/src/fpga_params.rs
