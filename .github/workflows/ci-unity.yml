name: ci-unity

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  unity:
    name: unity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          workspaces: |
            bindings/ffi
            xtask
          shared-key: ffi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: cargo xtask unity pack
