name: ci-unity

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  unity:
    name: unity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            bindings/ffi
            xtask
          shared-key: ffi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-about
      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev cmake
      - run: cargo xtask unity pack
