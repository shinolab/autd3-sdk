name: release-crates

on:
  push:
    tags:
      - 'v*'
      - 'rust-v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: release-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Verify the packages assemble
        run: cargo xtask rust publish --dry-run
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo xtask rust publish
      - name: Publish the emulator workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo xtask emulator publish
      - name: Publish autd3-rs-pattern-holo-wgpu to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo xtask holo-wgpu publish
