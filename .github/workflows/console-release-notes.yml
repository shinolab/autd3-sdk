name: console-release-notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  rewrite-release-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite the PowerShell install command and append the macOS note
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          fixed=$(printf '%s' "$body" | sed -E 's/powershell -ExecutionPolicy Bypass -c "(.*)"$/\1/')
          if [ "$body" = "$fixed" ]; then
            echo "::warning::PowerShell install snippet not found; install command left as dist generated it"
          fi
          {
            printf '%s\n\n' "$fixed"
            cat .github/console-macos-note.md
          } | gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file -
