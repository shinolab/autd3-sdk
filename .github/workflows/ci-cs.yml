name: ci-cs

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  cs:
    name: cs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          workspaces: |
            bindings/ffi
            xtask
          shared-key: ffi
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Format
        if: runner.os == 'Linux'
        run: cargo xtask cs format
      - run: cargo xtask cs build
      - run: cargo xtask cs test
