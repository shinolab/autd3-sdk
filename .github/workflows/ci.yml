name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      holo-wgpu: ${{ steps.filter.outputs.holo-wgpu }}
      simulator: ${{ steps.filter.outputs.simulator }}
      console: ${{ steps.filter.outputs.console }}
      image: ${{ steps.filter.outputs.image }}
      emulator: ${{ steps.filter.outputs.emulator }}
      cpu: ${{ steps.filter.outputs.cpu }}
      py: ${{ steps.filter.outputs.py }}
      ffi: ${{ steps.filter.outputs.ffi }}
      cs: ${{ steps.filter.outputs.cs }}
      unity: ${{ steps.filter.outputs.unity }}
      license: ${{ steps.filter.outputs.license }}
      doc: ${{ steps.filter.outputs.doc }}
      doc-samples: ${{ steps.filter.outputs.doc-samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          base: ${{ github.event_name == 'push' && github.ref_name || github.base_ref }}
          filters: |
            shared: &shared
              - '.github/actions/setup-rust/**'
            xtask-core: &xtask-core
              - 'xtask/src/util.rs'
              - 'xtask/Cargo.toml'
              - 'xtask/Cargo.lock'
            rust:
              - *shared
              - 'xtask/**'
              - 'crates/**'
              - 'firmware/cpu/fw/**'
              - 'tools/**'
              - 'examples/**'
              - 'appliance/lib/**'
              - 'appliance/cli/**'
              - 'appliance/server/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci-rust.yml'
            holo-wgpu:
              - *shared
              - *xtask-core
              - 'xtask/src/holo_wgpu.rs'
              - 'extras/autd3-rs-pattern-holo-wgpu/**'
              - 'crates/autd3-rs-pattern-holo/**'
              - 'crates/autd3-rs-core/**'
              - 'crates/autd3-rs-pattern/**'
              - '.cargo/**'
              - '.github/workflows/ci-holo-wgpu.yml'
            simulator:
              - *shared
              - *xtask-core
              - 'xtask/src/simulator.rs'
              - 'simulator/**'
              - 'crates/autd3-rs-core/**'
              - 'crates/autd3-rs-firmware-emulator/**'
              - 'crates/autd3-rs-link-remote/**'
              - 'Cargo.toml'
              - '.cargo/**'
              - '.github/workflows/ci-simulator.yml'
            console:
              - *shared
              - *xtask-core
              - 'xtask/src/console.rs'
              - 'xtask/src/simulator.rs'
              - 'console/**'
              - 'dist-workspace.toml'
              - '.cargo/**'
              - '.github/workflows/ci-console.yml'
              - '.github/workflows/parts/console-build-setup.yml'
              - '.github/workflows/console-release-notes.yml'
            image:
              - *shared
              - *xtask-core
              - 'xtask/src/image.rs'
              - 'xtask/src/image/**'
              - 'xtask/src/server.rs'
              - 'appliance/**'
              - 'crates/autd3-rs-core/**'
              - 'crates/autd3-rs-link-echocat/**'
              - 'crates/autd3-rs-link-remote/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci-image.yml'
            emulator:
              - *shared
              - *xtask-core
              - 'xtask/src/emulator.rs'
              - 'extras/autd3-rs-emulator/**'
              - 'crates/autd3-rs/**'
              - 'crates/autd3-rs-core/**'
              - 'crates/autd3-rs-firmware-emulator/**'
              - 'firmware/cpu/fw/**'
              - 'Cargo.toml'
              - '.cargo/**'
              - '.github/workflows/ci-emulator.yml'
            cpu:
              - *shared
              - *xtask-core
              - 'xtask/src/cpu.rs'
              - 'firmware/cpu/**'
              - 'firmware/fpga/rtl/sources_1/new/headers/params.svh'
              - '.github/workflows/ci-cpu.yml'
            py:
              - *shared
              - *xtask-core
              - 'xtask/src/py.rs'
              - 'bindings/python/**'
              - 'crates/**'
              - 'extras/autd3-rs-emulator/**'
              - 'Cargo.toml'
              - '.github/workflows/ci-py.yml'
            ffi:
              - *shared
              - *xtask-core
              - 'xtask/src/ffi.rs'
              - 'bindings/ffi/**'
              - 'crates/**'
              - 'Cargo.toml'
              - '.github/workflows/ci-ffi.yml'
            cs:
              - *shared
              - *xtask-core
              - 'xtask/src/cs.rs'
              - 'bindings/csharp/**'
              - 'bindings/ffi/**'
              - 'crates/**'
              - 'Cargo.toml'
              - '.github/workflows/ci-cs.yml'
            unity:
              - *shared
              - *xtask-core
              - 'xtask/src/unity.rs'
              - 'xtask/src/license.rs'
              - 'bindings/unity/**'
              - 'bindings/csharp/src/**'
              - 'bindings/ffi/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'about.toml'
              - 'about.hbs'
              - '.github/workflows/ci-unity.yml'
            license:
              - *shared
              - *xtask-core
              - 'xtask/src/license.rs'
              - 'deny.toml'
              - 'about.toml'
              - 'about.hbs'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - 'console/Cargo.toml'
              - 'console/Cargo.lock'
              - 'simulator/**/Cargo.toml'
              - 'simulator/Cargo.lock'
              - 'simulator/frontend/Cargo.lock'
              - 'bindings/ffi/**/Cargo.toml'
              - 'bindings/ffi/Cargo.lock'
              - 'bindings/python/**/Cargo.toml'
              - 'bindings/python/Cargo.lock'
              - 'LICENSE'
              - 'crates/**/LICENSE'
              - 'crates/autd3-rs-link-soem/COPYING'
              - 'firmware/cpu/**/LICENSE'
              - 'extras/**/LICENSE'
              - 'extras/**/Cargo.toml'
              - '.github/workflows/ci-license.yml'
            doc:
              - *shared
              - *xtask-core
              - 'xtask/src/doc.rs'
              - 'xtask/src/py.rs'
              - 'xtask/src/cs.rs'
              - 'xtask/src/bump.rs'
              - 'doc/**'
              - 'firmware/cpu/fw/src/version.rs'
              - 'firmware/fpga/rtl/sources_1/new/headers/params.svh'
              - 'crates/**'
              - 'extras/autd3-rs-emulator/**'
              - 'bindings/python/**'
              - 'bindings/csharp/**'
              - 'bindings/ffi/**'
              - 'Cargo.toml'
              - '.github/workflows/ci-doc.yml'
            doc-samples:
              - *shared
              - *xtask-core
              - 'xtask/src/doc.rs'
              - 'xtask/src/py.rs'
              - 'xtask/src/cs.rs'
              - 'doc/codes/**'
              - 'crates/**'
              - 'extras/autd3-rs-emulator/**'
              - 'bindings/python/**'
              - 'bindings/csharp/**'
              - 'bindings/ffi/**'
              - 'Cargo.toml'
              - '.github/workflows/ci-doc.yml'

  rust:
    name: rust
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/ci-rust.yml

  holo-wgpu:
    name: holo-wgpu
    needs: changes
    if: ${{ needs.changes.outputs.holo-wgpu == 'true' }}
    uses: ./.github/workflows/ci-holo-wgpu.yml

  simulator:
    name: simulator
    needs: changes
    if: ${{ needs.changes.outputs.simulator == 'true' }}
    uses: ./.github/workflows/ci-simulator.yml

  console:
    name: console
    needs: changes
    if: ${{ needs.changes.outputs.console == 'true' }}
    uses: ./.github/workflows/ci-console.yml

  image:
    name: image
    needs: changes
    if: ${{ needs.changes.outputs.image == 'true' }}
    uses: ./.github/workflows/ci-image.yml

  emulator:
    name: emulator
    needs: changes
    if: ${{ needs.changes.outputs.emulator == 'true' }}
    uses: ./.github/workflows/ci-emulator.yml

  cpu:
    name: cpu
    needs: changes
    if: ${{ needs.changes.outputs.cpu == 'true' }}
    uses: ./.github/workflows/ci-cpu.yml

  py:
    name: py
    needs: changes
    if: ${{ needs.changes.outputs.py == 'true' }}
    uses: ./.github/workflows/ci-py.yml

  ffi:
    name: ffi
    needs: changes
    if: ${{ needs.changes.outputs.ffi == 'true' }}
    uses: ./.github/workflows/ci-ffi.yml

  cs:
    name: cs
    needs: changes
    if: ${{ needs.changes.outputs.cs == 'true' }}
    uses: ./.github/workflows/ci-cs.yml

  unity:
    name: unity
    needs: changes
    if: ${{ needs.changes.outputs.unity == 'true' }}
    uses: ./.github/workflows/ci-unity.yml

  license:
    name: license
    needs: changes
    if: ${{ needs.changes.outputs.license == 'true' }}
    uses: ./.github/workflows/ci-license.yml
  doc:
    name: doc
    needs: changes
    if: ${{ needs.changes.outputs.doc == 'true' }}
    uses: ./.github/workflows/ci-doc.yml
    with:
      samples: ${{ needs.changes.outputs.doc-samples == 'true' }}

  semver:
    name: semver
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    uses: ./.github/workflows/ci-semver.yml

  guard:
    name: guard-main-source
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        id: chk
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "PR does not target main; nothing to enforce."
            echo "lineage=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$HEAD_REF" in
            release/*)
              echo "Source '$HEAD_REF' allowed; will verify develop lineage."
              echo "lineage=check" >> "$GITHUB_OUTPUT" ;;
            hotfix/*)
              echo "Source '$HEAD_REF' allowed (hotfix; no develop lineage required)."
              echo "lineage=skip" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::PRs into main must come from release/* or hotfix/* (got '$HEAD_REF')."
              exit 1 ;;
          esac
      - name: Checkout release head
        if: ${{ steps.chk.outputs.lineage == 'check' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify release is derived from develop
        if: ${{ steps.chk.outputs.lineage == 'check' }}
        run: |
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo "release branch contains develop's tip; lineage OK."
          else
            echo "::error::release/* must be cut from develop and contain its tip before merging into main. Merge develop into the release branch."
            exit 1
          fi

  ci-passed:
    name: ci-passed
    if: ${{ always() }}
    needs: [changes, rust, holo-wgpu, simulator, console, image, emulator, cpu, py, ffi, cs, unity, license, doc, semver, guard]
    runs-on: ubuntu-latest
    steps:
      - name: Verify detect-changes succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::detect-changes did not succeed (result: ${{ needs.changes.result }}); scope filtering is untrustworthy."
            exit 1
          fi
      - name: Verify no required job failed or was cancelled
        env:
          RESULTS: >-
            ${{ needs.rust.result }} ${{ needs.holo-wgpu.result }}
            ${{ needs.simulator.result }}
            ${{ needs.console.result }} ${{ needs.image.result }}
            ${{ needs.emulator.result }}
            ${{ needs.cpu.result }} ${{ needs.py.result }}
            ${{ needs.ffi.result }} ${{ needs.cs.result }}
            ${{ needs.unity.result }} ${{ needs.license.result }}
            ${{ needs.doc.result }} ${{ needs.semver.result }}
            ${{ needs.guard.result }}
        run: |
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job failed or was cancelled (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
