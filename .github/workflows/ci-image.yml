name: ci-image

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: xtask
      - run: cargo xtask image lint
      - run: cargo xtask server cross
