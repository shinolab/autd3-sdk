[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
autd3-cpu-wire = { path = "../firmware/cpu/wire" }
autd3-rs-core = { path = "../crates/autd3-rs-core", default-features = false }
zerocopy = { version = "0.8.63", default-features = false }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
protobuf = { version = "3.7.2", default-features = false }
scip = { version = "0.10.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
walkdir = { version = "2.5.0", default-features = false }
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56.0", default-features = false }

[workspace]

[lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
