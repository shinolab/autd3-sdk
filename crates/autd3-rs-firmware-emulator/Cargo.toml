[package]
name = "autd3-rs-firmware-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Software emulator of the AUTD3 device firmware (the real CPU firmware sources + a Rust FPGA emulator) for running tests without hardware."
# The firmware sources live outside this crate and are compiled into it (the
# `autd3-cpu-fw` crate is not published). `cargo xtask vendor-fw` copies them into
# `vendor/cpu-fw/` so a published package is self-contained; `build.rs` falls back
# to the in-repo firmware when no vendored copy is present.
include = ["src/**", "vendor/**", "build.rs", "Cargo.toml"]

[dependencies]
autd3-rs-core.workspace = true
zerocopy.workspace = true

[lints]
workspace = true
