[package]
name = "autd3-rs-firmware-emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Software emulator of the AUTD3 device firmware (the real CPU firmware sources + a Rust FPGA emulator) for running tests without hardware."
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
udp = ["dep:autd3-cpu-wire", "dep:tracing", "dep:zerocopy"]

[dependencies]
autd3-cpu-fw.workspace = true
autd3-cpu-wire = { workspace = true, optional = true }
autd3-rs-core.workspace = true
tracing = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }

[dev-dependencies]
autd3-cpu-wire.workspace = true
zerocopy.workspace = true

[[test]]
name = "udp"
path = "tests/udp.rs"
required-features = ["udp"]

[lints]
workspace = true
