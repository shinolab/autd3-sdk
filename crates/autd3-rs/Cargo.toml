[package]
name = "autd3-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core async client library for the AUTD3 SDK."
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
autd3-cpu-wire.workspace = true
autd3-rs-core.workspace = true
async-lock.workspace = true
futures-channel.workspace = true
if-addrs = { workspace = true, features = ["link-local"] }
socket2.workspace = true
thiserror.workspace = true
zerocopy.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
rstest.workspace = true
approx.workspace = true
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }
pollster.workspace = true
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
] }

[lints]
workspace = true
