[package]
name = "autd3-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core async client library for the AUTD3 SDK."
readme = "README.md"
keywords = ["autd3", "haptics"]
categories = ["science"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["serde"]
logging = ["autd3-rs-core/logging"]
serde = ["autd3-rs-core/serde"]

[dependencies]
autd3-cpu-wire.workspace = true
autd3-rs-core.workspace = true
async-lock.workspace = true
futures-channel.workspace = true
if-addrs = { workspace = true, features = ["link-local"] }
socket2.workspace = true
thiserror.workspace = true
zerocopy.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rstest.workspace = true
autd3-cpu-fw.workspace = true
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true
pollster.workspace = true
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
] }

[lints]
workspace = true
