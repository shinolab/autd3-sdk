[package]
name = "autd3-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core async client library for the AUTD3 phased-array kit."
readme = "README.md"
keywords = ["autd3", "haptics"]
categories = ["science"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["serde"]
legacy = []
logging = ["autd3-rs-core/logging"]
serde = ["autd3-rs-core/serde"]

[dependencies]
autd3-cpu-wire.workspace = true
autd3-rs-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
zerocopy.workspace = true
thread-priority.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
autd3-cpu-fw.workspace = true
autd3-rs-firmware-emulator.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
    "rt",
    "rt-multi-thread",
] }

[lints]
workspace = true
