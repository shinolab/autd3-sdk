[package]
name = "autd3-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core async client library for the AUTD3 SDK."
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
autd3-cpu-wire.workspace = true
autd3-rs-core.workspace = true
if-addrs = { workspace = true, features = ["link-local"] }
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
zerocopy.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { workspace = true, features = ["net", "uio", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Performance",
] }

[dev-dependencies]
rstest.workspace = true
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
