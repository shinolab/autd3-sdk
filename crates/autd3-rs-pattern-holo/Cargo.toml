[package]
name = "autd3-rs-pattern-holo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Multi-focus hologram optimization (Naive/GS/GSPAT) for autd3-rs."
readme = "README.md"
keywords = ["autd3", "haptics"]
categories = ["science"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[lib]
bench = false

[dependencies]
autd3-rs-core.workspace = true
nalgebra.workspace = true
rand = { version = "0.10.1", default-features = false, features = ["std", "thread_rng"] }
rayon = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
autd3-rs-pattern.workspace = true
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "holo"
harness = false

[lints]
workspace = true
