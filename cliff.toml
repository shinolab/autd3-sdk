[changelog]
header = """
# Changelog

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { sha = "91aa913e34c41425a841d1450f67e47da3f2d83b", skip = true },
    { sha = "04022074bc9e281829f4a31c5c0dfa0fef490988", skip = true },
    { sha = "ebd04fb0b18d169bc2c43e79842f33f94ccefb92", skip = true },
    { sha = "dee18b10f31e59b1b5f27640f1f9003389cbc927", skip = true },
    { sha = "d507e7fefe987ff8cbd1326af0dbb8d0686cb82f", skip = true },
    { sha = "ed7d6d860aeb9774c4507ebdba132b0cd1f8afae", skip = true },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->💥 Breaking Changes" },
    { message = "^[a-z]+(\\(.+\\))?!", group = "<!-- 0 -->💥 Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->🚀 Features" },
    { message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^revert", group = "<!-- 4 -->◀️ Revert" },
    { message = "^docs", skip = true },
    { message = "^refactor", skip = true },
    { message = "^test", skip = true },
    { message = "^chore\\(deps\\)", group = "<!-- 8 -->📦 Dependencies" },
    { message = "^chore", skip = true },
    { message = "^build", skip = true },
    { message = "^ci", skip = true },
    { message = ".*", skip = true },
]
filter_commits = true
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"
