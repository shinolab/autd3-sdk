[changelog]
header = """
# Changelog

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { sha = "91aa913e34c41425a841d1450f67e47da3f2d83b", skip = true },
    { sha = "04022074bc9e281829f4a31c5c0dfa0fef490988", skip = true },
    { sha = "ebd04fb0b18d169bc2c43e79842f33f94ccefb92", skip = true },
    { sha = "dee18b10f31e59b1b5f27640f1f9003389cbc927", skip = true },
    { sha = "d507e7fefe987ff8cbd1326af0dbb8d0686cb82f", skip = true },
    { sha = "ed7d6d860aeb9774c4507ebdba132b0cd1f8afae", skip = true },
    { sha = "9353a6238e55ee4ce2c52dceb8b71d9e09fad8ed", skip = true },
    { sha = "a8e7c704dc5d09fcadca0b9b4d931d38ebf55614", skip = true },
    { sha = "7a62b18814cbc962de6978fcfab1cc21fd60c62f", skip = true },
    { sha = "45ae90adb22e8f482de9d12682391e1758fd3cd5", skip = true },
    { sha = "8bda5c252c19e1a9b03c3869fc9612e9199818d7", skip = true },
    { sha = "586fad9a217594a2db9fc76afa01e074f4e6dbf4", skip = true },
    { sha = "dbc9b3b0ac4aeb459d3e519d1a249c1640ce91af", skip = true },
    { sha = "1bfc248b6111cb3fd866417988a2234956c35b45", skip = true },
    { sha = "407f34c74827685c5a5248894bc436fe7d17fca0", skip = true },
    { sha = "98233f751eb5ce33db40de6db8ba6e838e06b784", skip = true },
    { sha = "5ea0c4afe8169c188e8e936ae8f475d8ecd708f6", skip = true },
    { footer = "^BREAKING[ -]CHANGE", group = "<!-- 0 -->💥 Breaking Changes" },
    { message = "^[a-z]+(\\(.+\\))?!", group = "<!-- 0 -->💥 Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->🚀 Features" },
    { message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^revert", group = "<!-- 4 -->◀️ Revert" },
    { message = "^docs", skip = true },
    { message = "^refactor", skip = true },
    { message = "^test", skip = true },
    { message = "^chore\\(deps\\)", group = "<!-- 8 -->📦 Dependencies" },
    { message = "^chore", skip = true },
    { message = "^build", skip = true },
    { message = "^ci", skip = true },
    { message = ".*", skip = true },
]
filter_commits = true
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"
