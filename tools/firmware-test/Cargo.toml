[package]
name = "autd3-rs-firmware-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# SOEM (GPLv3) is statically linked, so this tool and its distribution are GPL-3.0-only.
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true
publish = false
description = "Interactive firmware acceptance-test runner exercising every AUTD3 firmware feature over a link."

[[bin]]
name = "autd3-rs-firmware-test"
path = "src/main.rs"

[dependencies]
autd3-rs.workspace = true
autd3-rs-pattern.workspace = true
autd3-rs-modulation.workspace = true
autd3-rs-link-ethercrab.workspace = true
autd3-rs-link-soem.workspace = true
autd3-rs-link-twincat.workspace = true
autd3-rs-link-remote.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
    "rt",
    "rt-multi-thread",
    "signal",
] }

[lints]
workspace = true
