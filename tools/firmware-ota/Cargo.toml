[package]
name = "autd3-rs-firmware-ota"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Update the AUTD3 CPU and FPGA firmware over EtherCAT (no J-Link / Vivado): streams the images through the PDO protocol, reboots the devices, and confirms the result."

[lib]
path = "src/lib.rs"

[[bin]]
name = "autd3-rs-firmware-ota"
path = "src/main.rs"

[dependencies]
autd3-cpu-wire.workspace = true
autd3-rs-core.workspace = true
autd3-firmware-writer.workspace = true
autd3-rs-link-echocat.workspace = true
autd3-rs-link-twincat.workspace = true
autd3-rs-link-remote.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
autd3-rs-firmware-emulator.workspace = true

[lints]
workspace = true
