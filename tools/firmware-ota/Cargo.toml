[package]
name = "autd3-rs-firmware-ota"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Update the AUTD3 CPU and FPGA firmware: writes the images, reboots the devices, and confirms the result."

[[bin]]
name = "autd3-firmware-ota"
path = "src/main.rs"

[dependencies]
autd3-cpu-wire.workspace = true
autd3-rs.workspace = true
autd3-rs-core.workspace = true
autd3-firmware-writer.workspace = true
clap.workspace = true
humantime.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }

[lints]
workspace = true
