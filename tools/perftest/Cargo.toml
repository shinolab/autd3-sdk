[package]
name = "autd3-rs-perftest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "CLI tool for measuring communication performance."

[[bin]]
name = "autd3-rs-perftest"
path = "src/main.rs"

[features]
mem-profile = []

[dependencies]
autd3-rs.workspace = true
autd3-rs-simulator-control.workspace = true
tracing-subscriber.workspace = true
autd3-cpu-wire.workspace = true
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }
clap.workspace = true
humantime.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt", "rt-multi-thread", "signal"] }
pollster.workspace = true
zerocopy.workspace = true

[lints]
workspace = true
