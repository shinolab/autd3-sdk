[package]
name = "autd3-remote-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "EtherCAT master appliance: drives the AUTD3 bus locally and relays frames to a remote client over TCP."

[[bin]]
name = "autd3-remote-server"
path = "src/main.rs"

[dependencies]
autd3-rs-appliance.workspace = true
autd3-cpu-wire.workspace = true
autd3-rs-core = { workspace = true, features = ["logging"] }
autd3-rs-link-echocat.workspace = true
autd3-rs-link-remote.workspace = true
anyhow.workspace = true
clap.workspace = true
humantime.workspace = true
serde.workspace = true
serde_ignored.workspace = true
toml.workspace = true
axum.workspace = true
if-addrs = { version = "0.15.0", default-features = false, features = [
    "link-local",
] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[lints]
workspace = true
