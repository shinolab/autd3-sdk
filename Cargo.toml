[workspace]
resolver = "3"
members = [
    "crates/autd3-rs",
    "crates/autd3-rs-core",
    "crates/autd3-rs-firmware-emulator",
    "crates/autd3-rs-pattern",
    "crates/autd3-rs-pattern-holo",
    "crates/autd3-rs-link-echocat",
    "crates/autd3-rs-link-ethercrab",
    "crates/autd3-rs-link-nop",
    "crates/autd3-rs-link-remote",
    "crates/autd3-rs-link-soem",
    "crates/autd3-rs-link-twincat",
    "crates/autd3-rs-modulation",
    "firmware/cpu/wire",
    "firmware/cpu/fw",
    "tools/perftest",
    "tools/synctune",
    "tools/firmware",
    "tools/firmware-test",
    "examples",
]
exclude = [
    "xtask",
    "firmware/cpu/board",
    "bindings/python",
    "bindings/ffi",
    "simulator",
    "extras/autd3-rs-emulator",
    "extras/autd3-rs-pattern-holo-wgpu",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"

[workspace.dependencies]
approx = { version = "0.5.1", default-features = false, features = ["std"] }
core_affinity = { version = "0.8.3", default-features = false }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
rayon = { version = "1.11.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
zerocopy = { version = "0.8.52", default-features = false, features = ["derive"] }
tokio = { version = "1.52.3", default-features = false, features = [
    "sync",
    "time",
    "macros",
    "rt",
] }
thread-priority = { version = "3.1.1", default-features = false }
clap = { version = "4.6.1", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
humantime = { version = "2.3.0", default-features = false }
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }

autd3-rs = { version = "0.4.0", path = "crates/autd3-rs" }
autd3-cpu-wire = { version = "0.4.0", path = "firmware/cpu/wire" }
autd3-cpu-fw = { version = "0.4.0", path = "firmware/cpu/fw" }
autd3-rs-core = { version = "0.4.0", path = "crates/autd3-rs-core" }
autd3-rs-firmware-emulator = { version = "0.4.0", path = "crates/autd3-rs-firmware-emulator" }
autd3-rs-pattern = { version = "0.4.0", path = "crates/autd3-rs-pattern" }
autd3-rs-pattern-holo = { version = "0.4.0", path = "crates/autd3-rs-pattern-holo" }
autd3-rs-link-echocat = { version = "0.4.0", path = "crates/autd3-rs-link-echocat" }
autd3-rs-link-ethercrab = { version = "0.4.0", path = "crates/autd3-rs-link-ethercrab" }
autd3-rs-link-nop = { version = "0.4.0", path = "crates/autd3-rs-link-nop" }
autd3-rs-link-remote = { version = "0.4.0", path = "crates/autd3-rs-link-remote" }
autd3-rs-link-soem = { version = "0.4.0", path = "crates/autd3-rs-link-soem" }
autd3-rs-link-twincat = { version = "0.4.0", path = "crates/autd3-rs-link-twincat" }
autd3-rs-modulation = { version = "0.4.0", path = "crates/autd3-rs-modulation" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
