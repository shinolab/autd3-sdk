[workspace]
resolver = "3"
members = [
    "crates/autd3-rs",
    "crates/autd3-rs-core",
    "crates/autd3-rs-firmware-emulator",
    "crates/autd3-rs-pattern",
    "crates/autd3-rs-pattern-holo",
    "crates/autd3-rs-modulation",
    "firmware/cpu/wire",
    "firmware/cpu/fw",
    "tools/perftest",
    "tools/firmware-writer",
    "tools/firmware-test",
    "tools/firmware-ota",
    "tools/fpga-memory",
    "tools/udp-emulator",
]
exclude = [
    "xtask",
    "firmware/cpu/board",
    "bindings/python",
    "bindings/ffi",
    "bindings/autd3-binding-rt",
    "simulator",
    "extras/autd3-rs-emulator",
    "extras/autd3-rs-pattern-holo-wgpu",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"
homepage = "https://hapislab.org/en/airborne-ultrasound-tactile-display"
keywords = ["autd3", "haptics"]
categories = ["science"]

[workspace.dependencies]
approx = { version = "0.5.1", default-features = false, features = ["std"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
num-integer = { version = "0.1.47", default-features = false }
rstest = { version = "0.28.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
zerocopy = { version = "0.8.63", default-features = false, features = [
    "derive",
] }
crc = { version = "3.4.0", default-features = false }
bitflags = { version = "2.13.2", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
tokio = { version = "1.54.1", default-features = false }
socket2 = { version = "0.6.5", default-features = false }
libc = { version = "0.2.191", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
futures-channel = { version = "0.3.34", default-features = false, features = [
    "alloc",
] }
async-lock = { version = "3.4.2", default-features = false, features = ["std"] }
pollster = { version = "1.0.1", default-features = false }
humantime = { version = "2.4.0", default-features = false }
hdrhistogram = { version = "7.6.0", default-features = false }
if-addrs = { version = "0.15.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
    "std",
    "derive",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
    "std",
] }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
criterion = { version = "0.8.2", default-features = false }
const_fn = { version = "0.4.12", default-features = false }
loom = { version = "0.7.2", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "9.1.1", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
winreg = { version = "0.56.0", default-features = false }

autd3-rs = { version = "0.13.0", path = "crates/autd3-rs" }
autd3-cpu-wire = { version = "0.13.0", path = "firmware/cpu/wire" }
autd3-cpu-fw = { version = "0.13.0", path = "firmware/cpu/fw" }
autd3-rs-core = { version = "0.13.0", path = "crates/autd3-rs-core" }
autd3-firmware-writer = { path = "tools/firmware-writer" }
autd3-rs-firmware-ota = { path = "tools/firmware-ota" }
autd3-rs-firmware-emulator = { version = "0.13.0", path = "crates/autd3-rs-firmware-emulator" }
autd3-rs-pattern = { version = "0.13.0", path = "crates/autd3-rs-pattern" }
autd3-rs-pattern-holo = { version = "0.13.0", path = "crates/autd3-rs-pattern-holo" }
autd3-rs-modulation = { version = "0.13.0", path = "crates/autd3-rs-modulation" }

[workspace.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
macro_now_doc_hidden = "allow"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
