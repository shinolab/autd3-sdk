[package]
name = "autd3-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "C ABI bindings for autd3-rs (client, datagram builder)."

[lib]
name = "autd3capi"
crate-type = ["cdylib"]

[dependencies]
autd3-rs = { workspace = true, features = ["logging"] }
autd3-rs-core.workspace = true
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }
autd3-ffi-abi.workspace = true

[dev-dependencies]
pollster = { version = "1.0.1", default-features = false }

[lints]
workspace = true
