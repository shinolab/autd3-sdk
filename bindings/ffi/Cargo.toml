[workspace]
resolver = "3"
members = [
    "autd3-ffi-abi",
    "autd3-ffi-core",
    "autd3-ffi",
    "autd3-ffi-pattern",
    "autd3-ffi-pattern-holo",
    "autd3-ffi-modulation",
    "../autd3-binding-rt",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"

[workspace.dependencies]
autd3-rs = { path = "../../crates/autd3-rs" }
autd3-rs-core = { path = "../../crates/autd3-rs-core" }
autd3-cpu-wire = { path = "../../firmware/cpu/wire" }
autd3-rs-pattern = { path = "../../crates/autd3-rs-pattern" }
autd3-rs-pattern-holo = { path = "../../crates/autd3-rs-pattern-holo" }
autd3-rs-modulation = { path = "../../crates/autd3-rs-modulation" }
autd3-ffi-abi = { path = "autd3-ffi-abi" }
autd3-binding-rt = { path = "../autd3-binding-rt" }
zerocopy = { version = "0.8.63", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
async-lock = { version = "3.4.2", default-features = false, features = ["std"] }
futures-channel = { version = "0.3.34", default-features = false, features = [
    "alloc",
] }
pollster = { version = "1.0.1", default-features = false }

[profile.release]
panic = "abort"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
missing_safety_doc = "allow"
doc_markdown = "allow"
