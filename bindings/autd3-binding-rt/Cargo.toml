[package]
name = "autd3-binding-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
workspace = "../ffi"
publish = false
description = "Runtime shared by the AUTD3 language bindings: the client the bindings drive, the tokio runtime that runs its futures and the tracing initialization."

[dependencies]
autd3-rs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
autd3-rs-firmware-emulator = { workspace = true, features = ["udp"] }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
