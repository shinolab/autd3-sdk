[workspace]
resolver = "3"
members = [
    "autd3-python-capsule",
    "autd3-core",
    "autd3",
    "autd3-pattern",
    "autd3-pattern-holo",
    "autd3-modulation",
    "autd3-emulator",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"

[workspace.dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"] }
autd3-rs = { path = "../../crates/autd3-rs" }
autd3-rs-core = { path = "../../crates/autd3-rs-core" }
autd3-rs-firmware-emulator = { path = "../../crates/autd3-rs-firmware-emulator" }
autd3-rs-pattern = { path = "../../crates/autd3-rs-pattern" }
autd3-rs-pattern-holo = { path = "../../crates/autd3-rs-pattern-holo" }
autd3-rs-modulation = { path = "../../crates/autd3-rs-modulation" }
autd3-rs-emulator = { path = "../../extras/autd3-rs-emulator", default-features = false }
autd3-python-capsule = { path = "autd3-python-capsule" }
bytemuck = { version = "1.25.0", default-features = false }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
