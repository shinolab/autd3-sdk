[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "autd3-link-echocat"
description = "Python bindings for autd3-rs-link-echocat (EtherCAT link via echocat)."
requires-python = ">=3.12"
license = "MIT"
version = "0.7.0"
dependencies = ["autd3-core==0.7.0"]

[tool.maturin]
module-name = "autd3_link_echocat"
manifest-path = "Cargo.toml"
include = ["THIRD-PARTY-LICENSES.md", "LICENSE"]
