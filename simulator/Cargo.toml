[workspace]
resolver = "3"
members = ["backend", "protocol"]
exclude = ["frontend"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

[workspace.dependencies]
approx = { version = "0.5.1", default-features = false, features = ["std"] }
rstest = { version = "0.28.0", default-features = false }
autd3-rs = { path = "../crates/autd3-rs", default-features = false }
autd3-cpu-wire = { path = "../firmware/cpu/wire" }
autd3-rs-core = { path = "../crates/autd3-rs-core" }
autd3-rs-firmware-emulator = { path = "../crates/autd3-rs-firmware-emulator" }
autd3-rs-simulator-protocol = { path = "protocol" }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
    "ws",
] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
rust-embed = { version = "8.13.0", default-features = false, features = ["mime-guess"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
