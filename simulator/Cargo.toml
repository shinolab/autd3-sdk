[workspace]
resolver = "3"
members = ["backend"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_enum_match_arm = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"

[workspace.dependencies]
approx = { version = "0.5.1", default-features = false, features = ["std"] }
rstest = { version = "0.28.0", default-features = false }
autd3-rs = { path = "../crates/autd3-rs", default-features = false }
autd3-cpu-wire = { path = "../firmware/cpu/wire" }
autd3-rs-core = { path = "../crates/autd3-rs-core" }
autd3-rs-firmware-emulator = { path = "../crates/autd3-rs-firmware-emulator" }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
glam = { version = "0.34.1", default-features = false, features = ["std", "bytemuck"] }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
