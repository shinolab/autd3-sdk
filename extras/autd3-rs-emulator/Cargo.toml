[workspace]
resolver = "3"
members = ["examples"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"
homepage = "https://hapislab.org/en/airborne-ultrasound-tactile-display"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

[workspace.dependencies]
autd3-rs = { version = "0.12.0", path = "../../crates/autd3-rs" }
autd3-rs-core = { version = "0.12.0", path = "../../crates/autd3-rs-core" }
autd3-rs-firmware-emulator = { version = "0.12.0", path = "../../crates/autd3-rs-firmware-emulator" }
autd3-rs-emulator = { path = "." }
autd3-rs-pattern = { path = "../../crates/autd3-rs-pattern" }
autd3-rs-modulation = { path = "../../crates/autd3-rs-modulation" }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
textplots = { version = "0.8.7", default-features = false }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
rayon = { version = "1.11.0", default-features = false }
approx = { version = "0.5.1", default-features = false, features = ["std"] }

[package]
name = "autd3-rs-emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hardware-free emulator for AUTD3: records device emission data and computes the ultrasound sound field offline."
readme = "README.md"
keywords = ["autd3", "haptics"]
categories = ["science"]

[dependencies]
autd3-rs.workspace = true
autd3-rs-core.workspace = true
autd3-rs-firmware-emulator.workspace = true
thiserror.workspace = true
rayon.workspace = true

[dev-dependencies]
approx.workspace = true
autd3-rs-pattern.workspace = true

[lints]
workspace = true
