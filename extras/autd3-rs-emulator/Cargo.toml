[workspace]
resolver = "3"
members = ["examples"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Shun Suzuki <suzuki@hapis.k.u-tokyo.ac.jp>"]
repository = "https://github.com/shinolab/autd3-sdk"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

[workspace.dependencies]
autd3-rs = { version = "0.4.0", path = "../../crates/autd3-rs" }
autd3-rs-core = { version = "0.4.0", path = "../../crates/autd3-rs-core" }
autd3-rs-firmware-emulator = { version = "0.4.0", path = "../../crates/autd3-rs-firmware-emulator" }
autd3-rs-emulator = { path = "." }
autd3-rs-pattern = { path = "../../crates/autd3-rs-pattern" }
autd3-rs-modulation = { path = "../../crates/autd3-rs-modulation" }
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
bytemuck = { version = "1.25.0", default-features = false, features = ["derive"] }
wgpu = { version = "29.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }
textplots = { version = "0.8.7" }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
pollster = { version = "1.0.1" }
polars = { version = "0.54.4", default-features = false, features = ["dtype-u8", "dtype-u16"] }
rayon = { version = "1.10.0" }
approx = { version = "0.5.1", default-features = false, features = ["std"] }

[package]
name = "autd3-rs-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hardware-free emulator for AUTD3: records device drive data and computes the ultrasound sound field offline."

[features]
default = ["polars"]
polars = ["dep:polars"]
gpu = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
autd3-rs.workspace = true
autd3-rs-core.workspace = true
autd3-rs-firmware-emulator.workspace = true
thiserror.workspace = true
pollster.workspace = true
rayon.workspace = true
polars = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true

[lints]
workspace = true
